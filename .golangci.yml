version: '2'

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - unconvert
    - gocritic
    - gosec
    - gocyclo
    - dupl
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
  exclusions:
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  tests: true
